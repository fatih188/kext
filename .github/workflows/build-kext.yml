# Builds SimpleMtkWlan.kext on a GitHub-hosted macOS runner (no local Mac needed).
# Untested: first run may show Xcode/SDK errors that need fixing.
name: build-simplemtkwlan

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Fetch kernel headers (MacKernelSDK)
        run: git clone --depth 1 https://github.com/acidanthera/MacKernelSDK MacKernelSDK

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path

      - name: Build SimpleMtkWlan (kext, unsigned)
        run: |
          xcodebuild -project SimpleMtkWlan.xcodeproj \
            -scheme SimpleMtkWlan \
            -configuration Release \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Locate built kext
        id: find
        run: |
          KEXT=$(find ~/Library/Developer/Xcode/DerivedData /tmp -name "SimpleMtkWlan.kext" -type d 2>/dev/null | head -n 1)
          if [ -z "$KEXT" ]; then
            echo "SimpleMtkWlan.kext not found" >&2
            exit 1
          fi
          mkdir -p artifact
          cp -R "$KEXT" artifact/
          echo "Found: $KEXT"

      - name: Upload kext artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleMtkWlan-kext
          path: artifact/SimpleMtkWlan.kext

  build-monterey:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Fetch kernel headers (MacKernelSDK)
        run: git clone --depth 1 https://github.com/acidanthera/MacKernelSDK MacKernelSDK

      - name: Build SimpleMtkWlan for macOS 12 (Monterey)
        run: |
          xcodebuild -project SimpleMtkWlan.xcodeproj \
            -scheme SimpleMtkWlan \
            -configuration Release \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Locate built kext
        run: |
          KEXT=$(find ~/Library/Developer/Xcode/DerivedData /tmp -name "SimpleMtkWlan.kext" -type d 2>/dev/null | head -n 1)
          if [ -z "$KEXT" ]; then
            echo "SimpleMtkWlan.kext not found" >&2
            exit 1
          fi
          mkdir -p artifact
          cp -R "$KEXT" artifact/
          echo "Found: $KEXT"

      - name: Upload kext artifact (Monterey)
        uses: actions/upload-artifact@v4
        with:
          name: SimpleMtkWlan-kext-monterey
          path: artifact/SimpleMtkWlan.kext

  build-mtkctl:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build mtkctl (x86_64, macOS 12+)
        run: |
          mkdir -p artifact
          clang -O2 -Wall -arch x86_64 -mmacosx-version-min=12.0 \
            -Iinclude/ClientKit -o artifact/mtkctl tools/mtkctl.c \
            -framework IOKit -framework CoreFoundation
          file artifact/mtkctl

      - name: Upload mtkctl
        uses: actions/upload-artifact@v4
        with:
          name: mtkctl
          path: artifact/mtkctl

  build-airport-tahoe:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Fetch kernel headers (MacKernelSDK)
        run: git clone --depth 1 https://github.com/acidanthera/MacKernelSDK MacKernelSDK

      - name: Build AirportMtkWlan for macOS 26 (Tahoe)
        run: |
          xcodebuild -project SimpleMtkWlan.xcodeproj \
            -target AirportMtkWlan \
            -configuration Debug \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            AMTK_IO80211_TARGET=__MAC_26_0 \
            build

      - name: Locate built kext
        run: |
          KEXT=$(find . ~/Library/Developer/Xcode/DerivedData -name "AirportMtkWlan.kext" -type d 2>/dev/null | head -n 1)
          if [ -z "$KEXT" ]; then
            echo "AirportMtkWlan.kext not found" >&2
            exit 1
          fi
          mkdir -p artifact
          cp -R "$KEXT" artifact/
          echo "Found: $KEXT"

      - name: Upload kext artifact (Tahoe, native Wi-Fi)
        uses: actions/upload-artifact@v4
        with:
          name: AirportMtkWlan-Tahoe
          path: artifact/AirportMtkWlan.kext
